version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: justizia-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - justizia-network
    volumes:
      - keycloak-data:/opt/keycloak/data

  redis:
    image: redis:7-alpine
    container_name: justizia-redis
    ports:
      - "6379:6379"
    networks:
      - justizia-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

networks:
  justizia-network:
    driver: bridge

volumes:
  keycloak-data:
  redis-data:
